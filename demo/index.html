<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: the on-screen keyboard shrinks the layout (and the
     editor) instead of overlaying it. The editor also copes with overlays. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>canvas-view demo</title>
<style>
	html, body { margin: 0; height: 100%; background: #21252b; color: #abb2bf; font: 13px system-ui, sans-serif; overflow: hidden; }
	body { display: flex; flex-direction: column; }
	#bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; flex-wrap: wrap; }
	#bar select, #bar button { font: inherit; }
	#stats { margin-left: auto; font: 12px ui-monospace, monospace; white-space: pre; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
	#editor { flex: 1; min-height: 0; }
	#editor > .cv-editor, #editor > .cm-editor { height: 100%; }
	body.bare #bar { display: none; }
	body.light { background: #f3f3f3; color: #383a42; }
	#bar button { font: 13px system-ui, sans-serif; padding: 4px 10px; }
	#settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 86vw); z-index: 20;
		background: #21252b; color: #d7dae0; box-shadow: -6px 0 24px rgba(0,0,0,.45); overflow-y: auto;
		transform: translateX(105%); transition: transform .18s ease-out; padding: 0 14px 24px; box-sizing: border-box;
		font: 14px system-ui, sans-serif; overscroll-behavior: contain; }
	#settings.open { transform: none; }
	#settings .head { position: sticky; top: 0; background: inherit; display: flex; justify-content: space-between;
		align-items: center; padding: 12px 0; z-index: 1; }
	#settings .head button { background: none; border: 0; color: inherit; font-size: 18px; padding: 4px 8px; }
	#settings h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #7f848e; margin: 16px 0 6px; }
	#settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
	#settings select { font: 13px system-ui, sans-serif; max-width: 58%; padding: 4px; background: #2c313a; color: inherit;
		border: 1px solid #3e4451; border-radius: 4px; }
	#settings .note { font-size: 12px; color: #7f848e; }
	#settings > button { font: 13px system-ui, sans-serif; padding: 6px 12px; }
	#menu { position: fixed; display: none; z-index: 10; gap: 2px; padding: 3px; border-radius: 8px;
		background: #3a3f4b; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
	#menu button { font: 14px system-ui, sans-serif; color: #e6e6e6; background: none; border: 0;
		padding: 10px 12px; border-radius: 6px; }
	#menu button:active { background: #4d5361; }
</style>
</head>
<body>
<div id="bar">
	<button id="settings-toggle">⚙ Settings</button>
	<button id="fling">Fling</button>
	<span id="stats"></span>
</div>
<div id="editor"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
